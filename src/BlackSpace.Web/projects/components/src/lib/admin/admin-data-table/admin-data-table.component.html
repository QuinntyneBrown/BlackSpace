<div class="table-container">
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }

  @if (!loading() && data().length === 0) {
    <div class="empty-state">No data available</div>
  }

  @if (data().length > 0) {
    <table mat-table [dataSource]="data()" matSort (matSortChange)="onSortChange($event)">
      @for (col of columns(); track col.name) {
        <ng-container [matColumnDef]="col.name">
          <th mat-header-cell *matHeaderCellDef [mat-sort-header]="col.sortable ? col.name : ''" [disabled]="!col.sortable">
            {{ col.label }}
          </th>
          <td mat-cell *matCellDef="let row">{{ row[col.name] }}</td>
        </ng-container>
      }

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="onEdit(row)" aria-label="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="onDelete(row)" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }

  <mat-paginator
    [length]="totalCount()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPageChange($event)"
    showFirstLastButtons
  ></mat-paginator>
</div>
