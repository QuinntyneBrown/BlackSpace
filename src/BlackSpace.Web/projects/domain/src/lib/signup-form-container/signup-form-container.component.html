@if (formState() === 'success') {
  <lib-success-state
    title="You're in. Welcome to the community."
    description="Check your email for a welcome message with a link to our LinkedIn group and details on the next virtual meetup."
  />
} @else {
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    @if (alertMessage()) {
      <lib-alert-banner [message]="alertMessage()" type="warning" />
    }

    <lib-form-input
      label="Full Name"
      placeholder="Enter your full name"
      [required]="true"
      [errorMessage]="fieldError('fullName')"
      formControlName="fullName"
    />

    <lib-form-input
      label="Email"
      placeholder="you@example.com"
      [required]="true"
      fieldType="email"
      [errorMessage]="fieldError('email')"
      formControlName="email"
    />

    <lib-form-input
      label="Current Role / Title"
      placeholder="e.g. Software Engineer"
      [errorMessage]="fieldError('roleTitle')"
      formControlName="roleTitle"
    />

    <lib-form-input
      label="Organization"
      placeholder="e.g. MDA Space"
      [errorMessage]="fieldError('organization')"
      formControlName="organization"
    />

    <lib-form-input
      label="How did you hear about us?"
      placeholder="Select one..."
      fieldType="select"
      [selectOptions]="referralSources()"
      [errorMessage]="fieldError('referralSource')"
      formControlName="referralSource"
    />

    <p class="reassurance">
      We'll send you a welcome email with a link to our LinkedIn group and details on the next
      virtual meetup. No spam, ever.
    </p>

    <lib-button-primary
      label="Join Black Space Canada"
      type="submit"
      [disabled]="signupForm.invalid"
      [loading]="isLoading()"
      (clicked)="onSubmit()"
    />
  </form>
}

@if (toastVisible()) {
  <lib-toast
    [title]="toastTitle()"
    [description]="toastDescription()"
    [type]="toastType()"
    [visible]="toastVisible()"
    (closed)="onToastClosed()"
  />
}
