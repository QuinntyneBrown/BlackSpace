services:
  db:
    image: postgres:17-alpine
    container_name: blackspace-db
    environment:
      POSTGRES_DB: blackspace
      POSTGRES_USER: blackspace
      POSTGRES_PASSWORD: blackspace_dev
    ports:
      - "5432:5432"
    volumes:
      - blackspace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackspace"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  blackspace-pgdata:
